services:
  cdt-monitor:
    build:
      context: .
      args:
        VERSION: "v2.0.5-mod"
    image: cdt-monitor:v2.0.5-mod
    container_name: cdt-monitor
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:43210:8080"
    environment:
      CDT_DATA_DIR: /data
      CDT_LISTEN: :8080
      CDT_WORKERS: 4
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "/cdt-monitor", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
